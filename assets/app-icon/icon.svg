<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The app icon. scripts/make-icons.py turns it into icon.ico (Windows) and
       AppIcon.icns (macOS); the app draws it as its window icon at runtime. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#363a4f"/>
      <stop offset="1" stop-color="#1e1e2e"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <path d="M232 260 V764" stroke="#cba6f7" stroke-width="56" stroke-linecap="round"/>
  <!-- Diff lines, evenly spaced 156 apart around the middle (512). -->
  <g stroke-width="92" stroke-linecap="round">
    <path d="M350 278 H700" stroke="#6c7086"/>
    <path d="M350 434 H620" stroke="#f38ba8"/>
    <path d="M350 590 H800" stroke="#a6e3a1"/>
    <path d="M350 746 H560" stroke="#6c7086"/>
  </g>
</svg>
