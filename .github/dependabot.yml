# Weekly pull requests (into development, the default branch) for outdated crates and
# GitHub Actions. Actions are pinned to commit SHAs; Dependabot updates the SHA and its
# version comment together. Minor and patch updates are grouped into one pull request
# per ecosystem, to keep the noise down.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      crates:
        update-types: [minor, patch]
    ignore:
      # resvg stays on the version iced uses (see Cargo.toml), so the window icon adds no
      # second copy of it. It moves when iced does.
      - dependency-name: resvg

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
