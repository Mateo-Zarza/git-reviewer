# Checks every pull request into development or main: formatting, lints, tests, and
# the Windows and macOS builds (their files are attached to the run, for testing).
#
# The job names are what the rulesets require by name, so renaming a job means
# updating the rulesets too: `fmt`, `clippy`, `test`, and the two build jobs,
# `build / Build (x86_64-pc-windows-msvc)` and `build / Build (aarch64-apple-darwin)`.

name: CI

on:
  pull_request:
    branches:
      - development
      - main
  # Test builds of mac-build before its PR exists. Remove this once the PR is open,
  # or every push runs CI twice (once per event).
  push:
    branches:
      - mac-build

permissions:
  contents: read

# A newer push to the same PR or branch makes the running checks pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt --no-self-update && rustup default stable
      - run: cargo fmt --all --check

  # Lints both platforms' code from the Windows runner: clippy only type-checks, so the
  # macOS target needs no Mac (and no macOS runner minutes).
  clippy:
    name: clippy
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          rustup toolchain install stable --profile minimal --component clippy \
            --target aarch64-apple-darwin --no-self-update
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy (Windows)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Clippy (macOS)
        run: cargo clippy --all-targets --locked --target aarch64-apple-darwin -- -D warnings

  # The tests are platform-independent (parsers and pure logic), so one OS is enough.
  test:
    name: test
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --no-self-update; rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked

  build:
    uses: ./.github/workflows/build.yml
