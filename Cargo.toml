[package]
name = "git-reviewer"
version = "0.2.1"
edition = "2024"

[dependencies]
iced = { version = "0.14.0", features = ["svg", "advanced"] }
iced_palace = "0.14.0"
notify-debouncer-mini = "0.8.0"
dirs = "7.0.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.2"
# Syntax highlighting: syntect with two-face's syntaxes (about 200 languages) and the
# onig regex engine (several times faster than the pure-Rust one). syntect is listed
# too only for `plist-load`, to read the bundled `.tmTheme`.
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
syntect = { version = "5.3.0", default-features = false, features = ["plist-load"] }

# Highlighting is about 5 times slower unoptimized (0.5 s instead of 0.1 s for a
# 5000-line file), so its crates are optimized in debug builds too.
[profile.dev.package.syntect]
opt-level = 3
[profile.dev.package.onig]
opt-level = 3
[profile.dev.package.onig_sys]
opt-level = 3